<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hera 받는 포탈 시안</title>
<style>
:root{--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.1);--stroke:rgba(255,255,255,.08);--t1:#fff;--t2:rgba(255,255,255,.79);--t3:rgba(255,255,255,.55);--accent:#60cdff;--solid:#2b2b2b;--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.1,.9,.2,1)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.43 'Segoe UI Variable Text','Segoe UI','Malgun Gothic',sans-serif;color:var(--t1);overflow:hidden;
 background:radial-gradient(1200px 700px at 30% 20%,#3a5f8a,#1b2a40 60%,#0f1622)}
.cap{position:fixed;left:24px;top:20px;max-width:560px;color:var(--t2);font-size:13px;z-index:5}
.cap b{color:var(--t1);font-size:15px;display:block;margin-bottom:6px}
.cap ol{margin:6px 0 12px;padding-left:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{all:unset;cursor:pointer;height:34px;padding:0 14px;border-radius:6px;background:var(--accent);color:#003049;font-weight:600;font-size:13px}
.btns button.alt{background:var(--card2);color:var(--t1);border:1px solid var(--stroke)}
.btns button:active{transform:scale(.97)}
.mac{position:fixed;right:0;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:11px;color:var(--t3);padding:8px 4px;letter-spacing:.1em}
#cv{position:fixed;inset:0;pointer-events:none;z-index:3}
.bar{position:fixed;left:0;right:0;bottom:0;height:48px;background:rgba(28,28,28,.85);backdrop-filter:blur(30px);border-top:1px solid var(--stroke);display:flex;align-items:center;z-index:2}
.apps{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.apps i{width:40px;height:40px;border-radius:4px;display:grid;place-items:center}
.apps i::after{content:"";width:24px;height:24px;border-radius:5px;background:var(--c)}
.tray{position:absolute;right:8px;display:flex;align-items:center;gap:6px;color:var(--t2);font-size:12px}
.tray span{width:32px;height:40px;display:grid;place-items:center;border-radius:4px}
.tray .clk{width:auto;padding:0 8px;text-align:right;line-height:1.25}
#hera{position:relative}
#hera svg{width:18px;height:18px}
#hera.gulp svg{animation:gulp 520ms var(--spring)}
#hera::after{content:"";position:absolute;inset:6px 4px;border-radius:6px;box-shadow:0 0 0 0 rgba(96,205,255,.0);transition:box-shadow 300ms}
#hera.glow::after{box-shadow:0 0 18px 4px rgba(96,205,255,.55)}
@keyframes gulp{0%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(.85)}100%{transform:scale(1)}}
.file{position:fixed;z-index:4;width:44px;height:54px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;pointer-events:none;box-shadow:0 0 18px rgba(120,200,255,.6);left:0;top:0;will-change:transform}
.toast{position:fixed;right:12px;bottom:60px;z-index:4;width:364px;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:8px;background:var(--solid);border:1px solid var(--stroke);box-shadow:0 16px 40px rgba(0,0,0,.45);
 transform:translateX(110%);transition:transform 380ms var(--ease)}
.toast.on{transform:none}
.toast .fi{width:36px;height:44px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.toast b{display:block;font-size:13px}.toast small{color:var(--t3);font-size:12px}
</style></head><body>
<div class="cap"><b>시안 — 맥에서 받을 때 포탈</b>
<ol>
<li><b style="display:inline;font-size:13px">일반으로 받음</b> (맥 받침·패널로 보냄): 트레이 Hera 아이콘 위에 작은 포탈이 열리고, 파일이 튀어나와 아이콘 안으로 쏙 → 아이콘 빛남 → 알림 카드.</li>
<li><b style="display:inline;font-size:13px">맥 가장자리 포탈로 받음</b>: 맥과 이어진 오른쪽 끝, 맥이 놓은 높이에 포탈이 열리고 파일이 튀어나와 → 1번처럼 트레이 아이콘으로.</li>
</ol>
파일은 둘 다 선반과 다운로드\Hera 에 들어가요. 전체화면 앱 중에는 애니메이션 없이 조용히 선반으로만.
<div class="btns" style="margin-top:10px"><button id="b1">① 일반으로 받기</button><button id="b2">② 가장자리 포탈로 받기</button><button class="alt" id="b3">② 다른 높이로</button></div></div>
<div class="mac">MacBook ▶</div>
<canvas id="cv"></canvas>
<div class="toast" id="toast"><span class="fi" id="tfi"></span><span><b>맥에서 파일을 받았어요</b><small id="tsub"></small></span></div>
<div class="bar">
  <div class="apps"><i style="--c:#3c9aff"></i><i style="--c:#ffb900"></i><i style="--c:#e81123"></i><i style="--c:#107c41"></i><i style="--c:#8764b8"></i></div>
  <div class="tray"><span>^</span><span id="hera" title="Hera"><svg viewBox="0 0 24 24" fill="none" stroke="#60cdff" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M8 12h8M12 8v8"/></svg></span><span>📶</span><span>🔊</span><span class="clk">17:50<br>2026-11-19</span></div>
</div>
<script>
const $ = (s) => document.querySelector(s)
const cv = $('#cv'), cx = cv.getContext('2d'), hera = $('#hera'), toast = $('#toast')
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches
const FILES = [['기획안_v3.pdf', '#c42b1c'], ['서버정보.xlsx', '#107c41'], ['스크린샷.png', '#8764b8']]
let fi = 0, busy = false
const size = () => { const d = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0) }
size(); addEventListener('resize', size)
// 포탈 = 승인 시안 v3 와 같은 그림. 받을 때는 입자가 안에서 밖으로 흘러나온다.
const P = { k: 0, target: 0, x: 0, y: 0, rx: 104, ry: 168, edge: true, spin: 0, flash: 0, shock: 0, run: false, last: 0,
  parts: Array.from({ length: 90 }, () => ({ a: Math.random() * 6.28, r: Math.random(), v: .25 + Math.random() * .5, s: .6 + Math.random() * 1.6, h: 190 + Math.random() * 30 })) }
function setPortal(t) { P.target = t; if (!P.run) { P.run = true; P.last = performance.now(); requestAnimationFrame(frame) } }
function frame(now) {
  const dt = Math.min(.05, (now - P.last) / 1000); P.last = now
  P.k += (P.target - P.k) * Math.min(1, dt * (P.target > P.k ? 9 : 6)); if (Math.abs(P.target - P.k) < .002) P.k = P.target
  P.spin += dt * 2.2 * (REDUCE ? 0 : 1); P.flash = Math.max(0, P.flash - dt * 2.4); if (P.shock > 0) P.shock = Math.min(1.01, P.shock + dt * 2.2)
  draw(dt)
  if (P.k > .001 || P.target > 0 || P.flash > 0 || (P.shock > 0 && P.shock < 1)) requestAnimationFrame(frame)
  else { P.run = false; cx.clearRect(0, 0, innerWidth, innerHeight); P.shock = 0 }
}
function draw(dt) {
  cx.clearRect(0, 0, innerWidth, innerHeight)
  const k = P.k, ex = P.x, ey = P.y, rx = P.rx * k, ry = P.ry * k
  const spill = cx.createRadialGradient(ex, ey, 0, ex, ey, 2.2 * P.rx * Math.max(k, .2))
  spill.addColorStop(0, `rgba(80,170,255,${.32 * k + P.flash * .4})`); spill.addColorStop(1, 'rgba(80,170,255,0)')
  cx.fillStyle = spill; cx.fillRect(ex - 3 * P.rx, ey - 3 * P.ry, 6 * P.rx, 6 * P.ry)
  if (P.edge) { const l = cx.createLinearGradient(0, ey - 260, 0, ey + 260); l.addColorStop(0, 'rgba(150,220,255,0)'); l.addColorStop(.5, `rgba(170,230,255,${.75 * k})`); l.addColorStop(1, 'rgba(150,220,255,0)'); cx.fillStyle = l; cx.fillRect(ex - 2, ey - 260, 2, 520) }
  if (k > .01) {
    cx.save(); cx.translate(ex, ey)
    cx.save(); cx.scale(1, ry / rx)
    const core = cx.createRadialGradient(0, 0, 0, 0, 0, rx)
    core.addColorStop(0, '#02060f'); core.addColorStop(.45, '#071a3c'); core.addColorStop(.78, '#1554b8'); core.addColorStop(.93, '#4fb4ff'); core.addColorStop(1, 'rgba(120,210,255,0)')
    cx.fillStyle = core; cx.beginPath(); cx.arc(0, 0, rx, 0, 6.29); cx.fill(); cx.restore()
    cx.globalCompositeOperation = 'lighter'
    for (let arm = 0; arm < 4; arm++) {
      cx.beginPath()
      for (let t = 0; t <= 1; t += .02) { const a = -P.spin * (arm % 2 ? 1 : 1.2) + arm * 1.571 + t * 4.2, rr = (1 - t) * .95; const px = Math.cos(a) * rx * rr, py = Math.sin(a) * ry * rr; t === 0 ? cx.moveTo(px, py) : cx.lineTo(px, py) }
      cx.strokeStyle = `rgba(${arm % 2 ? '120,200,255' : '190,235,255'},${.16 + .12 * k + P.flash * .3})`; cx.lineWidth = 2.2 * k * (P.rx / 104 + .3); cx.stroke()
    }
    for (const p of P.parts) { // 받을 때: 바깥으로
      if (!REDUCE) { p.r += p.v * dt * .6; p.a -= dt * (1.4 + (1 - p.r) * 3) }
      if (p.r > .97) { p.r = .04 + Math.random() * .1; p.a = Math.random() * 6.28 }
      const px = Math.cos(p.a) * rx * p.r, py = Math.sin(p.a) * ry * p.r, al = Math.min(1, (1 - p.r) * 2) * (.55 + .45 * k)
      cx.fillStyle = `hsla(${p.h},100%,${70 + 20 * p.r}%,${al})`; cx.beginPath(); cx.arc(px, py, p.s * (P.rx / 104 * .7 + .3) * Math.max(k, .4), 0, 6.29); cx.fill()
    }
    cx.save(); cx.scale(1, ry / rx)
    cx.lineWidth = 3 + 2 * P.flash; cx.strokeStyle = `rgba(200,240,255,${.65 * k + P.flash * .35})`; cx.shadowColor = '#5ab8ff'; cx.shadowBlur = 24 + 30 * P.flash
    cx.beginPath(); cx.arc(0, 0, rx, 0, 6.29); cx.stroke(); cx.shadowBlur = 0
    for (let i = 0; i < 3; i++) { const a0 = -P.spin * 1.7 + i * 2.1; cx.strokeStyle = `rgba(255,255,255,${.85 * k})`; cx.lineWidth = 2; cx.beginPath(); cx.arc(0, 0, rx, a0, a0 + .55); cx.stroke() }
    cx.restore()
    if (P.flash > 0) { cx.fillStyle = `rgba(220,245,255,${P.flash * .55})`; cx.save(); cx.scale(1, ry / rx); cx.beginPath(); cx.arc(0, 0, rx * .9, 0, 6.29); cx.fill(); cx.restore() }
    cx.globalCompositeOperation = 'source-over'; cx.restore()
  }
  if (P.shock > 0 && P.shock < 1) { const s = P.shock; cx.save(); cx.translate(ex, ey); cx.scale(1, P.ry / P.rx); cx.strokeStyle = `rgba(160,225,255,${(1 - s) * .9})`; cx.lineWidth = 6 * (1 - s) + 1; cx.beginPath(); cx.arc(0, 0, P.rx * (.6 + s * 2.4), P.edge ? 1.571 : 0, P.edge ? 4.712 : 6.29); cx.stroke(); cx.restore() }
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms))
const center = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2] }
// 파일: 포탈 가운데에서 작게 나와 커지며 튀어나옴 → 잠깐 떠 있다가 → 포물선으로 트레이 아이콘에 쏙
async function receive(edgeY) {
  if (busy) return; busy = true
  const [name, col] = FILES[fi++ % FILES.length], ext = name.split('.').pop()
  const [hx, hy] = center(hera)
  if (edgeY == null) Object.assign(P, { edge: false, x: hx, y: hy - 110, rx: 46, ry: 46 })
  else Object.assign(P, { edge: true, x: innerWidth, y: edgeY, rx: 104, ry: 168 })
  setPortal(1); await wait(REDUCE ? 0 : 420)
  P.flash = 1; P.shock = .01
  const f = document.createElement('div'); f.className = 'file'; f.textContent = ext.toUpperCase(); f.style.background = col; document.body.append(f)
  const out = edgeY == null ? [hx - 4, hy - 175] : [innerWidth - 190, edgeY - 40] // 튀어나와 멈추는 자리
  const T = (x, y, r, s) => `translate(${x - 22}px, ${y - 27}px) rotate(${r}deg) scale(${s})`
  const pop = f.animate([{ transform: T(P.x, P.y, -300, .1), opacity: 0 }, { transform: T(...out, -20, 1.12), opacity: 1, offset: .75 }, { transform: T(...out, 0, 1), opacity: 1 }],
    { duration: REDUCE ? 1 : 620, easing: 'cubic-bezier(.2,.9,.3,1.2)', fill: 'forwards' })
  await pop.finished; setPortal(0); await wait(REDUCE ? 0 : 260)
  // 포물선: 위로 살짝 떴다가 아이콘으로
  const kf = [], N = 24, [ox, oy] = out, peak = Math.min(oy, hy) - 90
  for (let i = 0; i <= N; i++) { const t = i / N, x = ox + (hx - ox) * t, y = (1 - t) * (1 - t) * oy + 2 * (1 - t) * t * peak + t * t * hy; kf.push({ transform: T(x, y, t * 25, 1 - .8 * t), opacity: t > .9 ? (1 - t) * 10 : 1 }) }
  const fly = f.animate(kf, { duration: REDUCE ? 1 : 700, easing: 'cubic-bezier(.45,0,.55,1)', fill: 'forwards' })
  await fly.finished; f.remove()
  hera.classList.remove('gulp'); void hera.offsetWidth; hera.classList.add('gulp', 'glow'); setTimeout(() => hera.classList.remove('glow'), 900)
  $('#tfi').textContent = ext.toUpperCase(); $('#tfi').style.background = col; $('#tsub').textContent = `${name} · 선반과 다운로드\\Hera에 있어요`
  toast.classList.add('on'); await wait(2600); toast.classList.remove('on'); await wait(300)
  busy = false
}
$('#b1').onclick = () => receive(null)
$('#b2').onclick = () => receive(innerHeight * .42)
$('#b3').onclick = () => receive(innerHeight * (.2 + Math.random() * .5))
</script>
</body></html>
